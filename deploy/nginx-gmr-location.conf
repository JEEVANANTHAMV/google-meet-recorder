# Google Meet Recorder — TLS endpoint via the ERP host.
# Paste inside the `server { server_name erp.lmsmybeta.com; ... listen 443 ssl; }` block of
# /etc/nginx/sites-available/prod, ABOVE `location / {`. Then: sudo nginx -t && sudo systemctl reload nginx
#
#   wss://erp.lmsmybeta.com/gmr        -> ws://127.0.0.1:8001/      (recorder WebSocket)
#   https://erp.lmsmybeta.com/gmr/api/ -> http://127.0.0.1:8001/api/ (schedule lookup, meetings API)
location = /gmr {
    rewrite ^ /gmr/ last;
}
location /gmr/ {
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-lived recording sockets. Both sides heartbeat every 10-15s, so these only bound a truly dead peer.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 10s;

    # Stream video chunks straight through instead of buffering them in nginx.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 20M;
}
